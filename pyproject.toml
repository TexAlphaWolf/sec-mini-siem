[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minisiem"
version = "1.0.0"
description = "A small, readable SIEM: parse logs, detect attacks with Sigma-style rules, explore alerts in a dashboard."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "pyyaml>=6.0",
  "maxminddb>=2.6",
  "alembic>=1.13",
  "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.4", "mypy>=1.10", "types-PyYAML", "mmdb-writer>=0.2"]

[project.scripts]
minisiem = "minisiem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
minisiem = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Any warning fails the build, so leaks (such as unclosed database connections) show up early.
filterwarnings = [
  "error",
  # Raised by FastAPI's TestClient inside the installed test dependencies, not by this project.
  "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]

[tool.coverage.run]
source = ["minisiem"]
# Alembic loads these by path, so coverage cannot see them; tests/test_migrations.py runs them.
omit = ["*/migrations/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Test data and sample-log generators contain long literal log lines.
"tests/*" = ["E501"]
"scripts/*" = ["E501"]
