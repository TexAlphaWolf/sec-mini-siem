services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: minisiem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      POSTGRES_DB: minisiem
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minisiem -d minisiem"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://minisiem:${POSTGRES_PASSWORD}@db:5432/minisiem
      MINISIEM_RULES_DIR: /app/rules
      MINISIEM_LOG_TZ: ${MINISIEM_LOG_TZ:-UTC}
      MINISIEM_API_TOKEN: ${MINISIEM_API_TOKEN:-}
    volumes:
      - ./rules:/app/rules:ro        # edit a rule, then restart the app
      - ./sample_logs:/data:ro       # demo logs
    ports:
      # Bound to localhost on purpose: put a reverse proxy with TLS and auth in front to expose it.
      - "127.0.0.1:${MINISIEM_PORT:-8000}:8000"

volumes:
  pgdata:
