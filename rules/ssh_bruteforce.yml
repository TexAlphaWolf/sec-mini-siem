id: ssh-bruteforce
title: SSH brute-force attempt
description: Five or more failed SSH logins from the same source IP within one minute.
severity: high
tags: [attack.credential_access, attack.t1110]
match:
  event_type: [ssh_failed_password, ssh_invalid_user]
threshold:
  count: 5
  window: 60s
  group_by: src_ip
