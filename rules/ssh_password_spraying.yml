id: ssh-password-spraying
title: SSH password spraying
description: Failed SSH password logins for five or more different accounts from one source IP within ten minutes. Spraying tries few passwords against many accounts to stay under per-account lockouts, so it looks different from a classic brute force on one account.
severity: high
tags: [attack.credential_access, attack.t1110.003]
match:
  event_type: ssh_failed_password
threshold:
  count: 5
  window: 10m
  group_by: src_ip
  distinct: username
