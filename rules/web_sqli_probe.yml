id: web-sqli-probe
title: SQL injection probe
description: A request contains common SQL injection payloads. The path is URL-decoded before matching.
severity: high
tags: [attack.initial_access, attack.t1190]
match:
  event_type: http_request
  path_decoded|contains:
    - union select
    - or 1=1
    - information_schema
    - sleep(
    - benchmark(
# One alert per source IP per 5 minutes: injection tools send hundreds of payloads.
threshold:
  count: 1
  window: 5m
  group_by: src_ip
