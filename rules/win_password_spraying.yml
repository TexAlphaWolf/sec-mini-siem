id: win-password-spraying
title: Windows password spraying
description: Failed Windows logons for five or more different accounts from one source IP within ten minutes. Spraying tries a few passwords against many accounts to stay under lockout limits.
severity: high
tags: [attack.credential_access, attack.t1110.003]
match:
  event_type: win_logon_failed
threshold:
  count: 5
  window: 10m
  group_by: src_ip
  distinct: username
