id: win-admin-group-change
title: Member added to an administrator group
description: An account was added to a privileged group (events 4728, 4732, 4756). Group names are matched in English, Italian, French and German; add yours if Windows runs in another language.
severity: high
tags: [attack.persistence, attack.privilege_escalation, attack.t1098]
match:
  event_type: win_group_member_added
  group:
    - Administrators
    - Amministratori
    - Administrateurs
    - Administratoren
    - Domain Admins
    - Enterprise Admins
    - Schema Admins
